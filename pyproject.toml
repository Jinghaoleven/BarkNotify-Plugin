[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "barknotify-plugin"
version = "0.5.0"
description = "Bark push notifications for Codex sessions"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["codex", "bark", "notifications", "plugins"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/Jinghaoleven/BarkNotify-Plugin"
Issues = "https://github.com/Jinghaoleven/BarkNotify-Plugin/issues"

[project.scripts]
barknotify-plugin = "barknotify_plugin.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["barknotify_plugin*"]

[tool.setuptools.package-data]
barknotify_plugin = ["LICENSE", "NOTICE", "*.json", "assets/*.json", "skills/*/SKILL.md", "scripts/*.py"]
